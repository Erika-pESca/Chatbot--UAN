        /**
         * Muestra una animación de "Escribiendo..." ("...") para simular que el bot está procesando.
         */
        // ==========================================
        // 5. FUNCIONES DE INTERFAZ GRÁFICA (UI)
        // ==========================================
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatBody.appendChild(typingDiv);
            scrollToBottom();
        }

        /**
         * Oculta (elimina) la animación de "Escribiendo...".
         */
        function hideTyping() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        /**
         * Hace que el área de chat se desplace automáticamente hacia el último mensaje enviado.
         */
        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        
        /**
         * Dibuja los botones (chips) correspondientes a un ID de menú específico.
         * @param {string} menuId - El identificador del menú a mostrar (ej. 'main', 'cat_pagos').
         * @param {boolean} isRestore - Indica si se está restaurando el menú desde el historial.
         */
        function renderMenu(menuId, isRestore = false) {
            const items = menus[menuId];
            if (!items) return;

            // Si el último elemento en el chat ya es un menú de opciones, lo removemos para no apilar duplicados
            const lastChild = chatBody.lastElementChild;
            if (lastChild && lastChild.classList.contains('options-container')) {
                lastChild.remove();
            }

        /**
         * Realiza la consulta a la IA mediante Streaming SSE (Server-Sent Events)
         * Despliega la respuesta token por token en tiempo real con efecto máquina de escribir fluido.
         */
        async function fetchStreamIA(text) {
            const iaUrl = "/configuracion_chat.php?chat_ai=1&stream=1&q=" + encodeURIComponent(text);
            
            let rowDiv = null;
            let msgWrapper = null;
            let msgDiv = null;
            let contentSpan = null;
            let cursorSpan = null;
            let finalHtml = '';
            let streamFinished = false;
            const textQueue = [];
            let isTypingLoop = false;
            let receivedAnyData = false;
            
            // Crea la burbuja del bot justo cuando llega el primer contenido
            function ensureBotRow() {
                if (rowDiv) return;
                if (typeof hideTyping === 'function') hideTyping();
                
                rowDiv = document.createElement('div');
                rowDiv.className = 'bot-message-row';
                const img = document.createElement('img');
                img.src = `${BASE_DOMAIN}/images/admin/ChatBot/GnosUAN-small.png`;
                img.className = 'bot-avatar-chat';
                img.alt = 'Bot Avatar';
                rowDiv.appendChild(img);
                
                msgWrapper = document.createElement('div');
                msgWrapper.style.display = 'flex';
                msgWrapper.style.flexDirection = 'column';
                msgWrapper.style.maxWidth = '100%';
                
                msgDiv = document.createElement('div');
                msgDiv.className = 'message bot';
                msgDiv.innerHTML = '<span class="stream-content"></span><span class="typing-cursor">▌</span>';
                msgWrapper.appendChild(msgDiv);
                rowDiv.appendChild(msgWrapper);
                chatBody.appendChild(rowDiv);
                
                contentSpan = msgDiv.querySelector('.stream-content');
                cursorSpan = msgDiv.querySelector('.typing-cursor');
                scrollToBottom();
            }
            
            // Tokenizador para que etiquetas como <b> o <br> sean atómicas y el texto se escriba letra a letra
            function tokenize(html) {
                const tokens = [];
                const regex = /(<[^>]+>)|([^<]+)/g;
                let match;
                while ((match = regex.exec(html)) !== null) {
                    if (match[1]) {
                        tokens.push({ isTag: true, val: match[1] });
                    } else if (match[2]) {
                        for (let i = 0; i < match[2].length; i++) {
                            tokens.push({ isTag: false, val: match[2][i] });
                        }
                    }
                }
                return tokens;
            }
            
            let rawStreamText = '';
            let textEnqueuedIndex = 0;
            let linksStarted = false;

            function feedChunkToTypewriter(chunk) {
                if (!chunk) return;
                rawStreamText += chunk;
                if (!linksStarted) {
                    const linkMatch = rawStreamText.search(/<a\b|\[/i);
                    if (linkMatch !== -1) {
                        linksStarted = true;
                        const convPart = rawStreamText.slice(textEnqueuedIndex, linkMatch);
                        if (convPart) enqueueText(convPart);
                        textEnqueuedIndex = linkMatch;
                    } else {
                        let toEnqueue = rawStreamText.slice(textEnqueuedIndex);
                        const lastOpen = toEnqueue.lastIndexOf('<');
                        const lastClose = toEnqueue.lastIndexOf('>');
                        if (lastOpen > lastClose) {
                            toEnqueue = toEnqueue.slice(0, lastOpen);
                        }
                        if (toEnqueue) {
                            enqueueText(toEnqueue);
                            textEnqueuedIndex += toEnqueue.length;
                        }
                    }
                }
            }

            function enqueueText(str) {
                if (!str) return;
                ensureBotRow();
                const tokens = tokenize(str);
                for (let t of tokens) {
                    textQueue.push(t);
                }
                if (!isTypingLoop) {
                    processTypewriterQueue();
                }
            }
            
            function processTypewriterQueue() {
                if (textQueue.length === 0) {
                    isTypingLoop = false;
                    if (streamFinished) {
                        finishBotMessage();
                    }
                    return;
                }
                isTypingLoop = true;
                
                // Ritmo de escritura progresivo, natural y visualmente agradable
                const step = textQueue.length > 80 ? 3 : (textQueue.length > 30 ? 2 : 1);
                const batch = textQueue.splice(0, step);
                for (let token of batch) {
                    if (token.isTag) {
                        contentSpan.innerHTML += token.val;
                    } else {
                        const textNode = document.createTextNode(token.val);
                        contentSpan.appendChild(textNode);
                    }
                }
                scrollToBottom();
                
                setTimeout(processTypewriterQueue, 16);
            }
            
            function finishBotMessage() {
                if (cursorSpan) cursorSpan.remove();
                
                const contenidoDefinitivo = finalHtml || (contentSpan ? contentSpan.innerHTML : '');
                
                // Si la IA devolvió un trigger de menú (ej: q_menu_ o q_disambig_)
                if (contenidoDefinitivo.startsWith('q_menu_') || contenidoDefinitivo.startsWith('q_disambig_')) {
                    if (rowDiv) rowDiv.remove();
                    let matchObjIA = null;
                    for (const key in menus) {
                        const found = menus[key].find(item => item.id === contenidoDefinitivo.trim());
                        if (found) { matchObjIA = found; break; }
                    }
                    if (matchObjIA) {
                        renderAnswer({ botText: matchObjIA.botReply || '', links: matchObjIA.links || [], showMenu: matchObjIA.showMenu || 'CURRENT', origenRespuesta: 'IA (Menú)' });
                        return;
                    }
                }
                
                if (msgDiv) {
                    msgDiv.innerHTML = contenidoDefinitivo;
                }
                scrollToBottom();
                
                // Guardar en historial local
                chatHistory.push({ content: contenidoDefinitivo, sender: 'bot', isHtml: true, origenRespuesta: 'Inteligencia Artificial' });
                localStorage.setItem('uan_chat_history', JSON.stringify(chatHistory));
                
                // Guardar en MySQL
                const savePromise = saveMessageToDB(contenidoDefinitivo, 'bot', 'Inteligencia Artificial');
                if (savePromise && msgWrapper) {
                    savePromise.then(id_mensaje => {
                        if (id_mensaje) {
                            const feedbackDiv = document.createElement('div');
                            feedbackDiv.className = 'feedback-container';
                            
                            const likeBtn = document.createElement('button');
                            likeBtn.className = 'feedback-btn like-btn';
                            likeBtn.title = 'Me sirvió';
                            likeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>';
                            
                            const dislikeBtn = document.createElement('button');
                            dislikeBtn.className = 'feedback-btn dislike-btn';
                            dislikeBtn.title = 'No me sirvió';
                            dislikeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>';
                            
                            const handleRate = (calificacion) => {
                                if (likeBtn.disabled) return;
                                likeBtn.disabled = true;
                                dislikeBtn.disabled = true;
                                if (calificacion === 1) likeBtn.classList.add('active-like');
                                if (calificacion === -1) dislikeBtn.classList.add('active-dislike');
                                
                                fetch('/configuracion_chat.php?accion_secreta=calificar_respuesta', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ id_mensaje: id_mensaje, calificacion: calificacion, codigo_navegador: sessionId })
                                }).catch(() => {});
                            };
                            
                            likeBtn.onclick = () => handleRate(1);
                            dislikeBtn.onclick = () => handleRate(-1);
                            feedbackDiv.appendChild(likeBtn);
                            feedbackDiv.appendChild(dislikeBtn);
                            msgWrapper.appendChild(feedbackDiv);
                            scrollToBottom();
                        }
                    });
                }
            }
            
            try {
                const response = await fetch(iaUrl);

                // Log detallado para diagnóstico: ver exactamente qué devuelve el servidor
                console.info('[Stream] HTTP Status:', response.status, response.statusText);
                console.info('[Stream] Content-Type:', response.headers.get('Content-Type'));

                // Si el servidor devuelve un error HTTP duro (4xx sin body, 5xx), lanzar
                // PERO si es 200 o cualquier código con body readable (caso de proxies que
                // devuelven 200 con Content-Type text/html en lugar de text/event-stream),
                // intentamos leer el body de todas formas para obtener datos.
                if (!response.ok && !response.body) {
                    throw new Error("HTTP " + response.status + " sin body");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = '';
                let rawBodyForDebug = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    rawBodyForDebug += chunk;
                    buffer += chunk;
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // Mantener línea incompleta
                    
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (line.startsWith("data: ")) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.chunk) {
                                    receivedAnyData = true;
                                    feedChunkToTypewriter(data.chunk);
                                }
                                if (data.final_html) {
                                    finalHtml = data.final_html;
                                    receivedAnyData = true;
                                    // Si por búferes de red no se desplegó en chunks, activar la máquina de escribir
                                    if (textQueue.length === 0 && !contentSpan) {
                                        const buttonRegex = /(<a\b[^>]*class=['"][^'"]*chat-link-btn[^'"]*['"][^>]*>[\s\S]*?<\/a>)/gi;
                                        let convText = finalHtml.replace(buttonRegex, '').trim().replace(/(<br\s*\/?>\s*)+$/gi, '');
                                        enqueueText(convText || finalHtml);
                                    }
                                }
                            } catch(e) {}
                        }
                    }
                }
                
                if (!receivedAnyData) {
                    // Mostrar los primeros 500 caracteres de lo que llegó para diagnóstico
                    console.error('[Stream] Cuerpo RAW recibido (primeros 500 chars):', rawBodyForDebug.substring(0, 500));
                    throw new Error("Stream vacio o sin datos");
                }
                
                streamFinished = true;
                if (!isTypingLoop && textQueue.length === 0) {
                    finishBotMessage();
                }
                
                return true;
            } catch(err) {
                console.warn("Fallo el streaming SSE:", err);
                if (rowDiv) rowDiv.remove();
                if (typeof hideTyping === 'function') hideTyping();
                return false;
            }
        }

        async function processInput(text, skipUserMessage = false) {
            if (currentOptionsContainer) {
                currentOptionsContainer.classList.add('disabled');
            }

            // INTERCEPTAMOS TEXTOS CLAVE PARA AUTOCOMPLETADO
            const txt = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            // 1. Mostrar inmediatamente el mensaje del usuario y estado "escribiendo"
            if (!skipUserMessage) {
                addMessage(text, 'user', false, false, 'Texto Libre');
            }
            showTyping();

            // =========================================================
            // PROTECCIÓN FRONTEND: Límite de longitud extrema (Anti-Spam)
            // =========================================================
            if (text.length > 1000) {
                setTimeout(() => {
                    hideTyping();
                    const fallbackMsg = `Recuerda que soy tu asistente de navegación en la UAN 🤗. Tu consulta es bastante extensa; para darte la mejor orientación personalizada, puedes chatear directamente con nosotros por WhatsApp:<br><br><a href="https://api.whatsapp.com/send/?phone=573223447443&text=Hola,%20necesito%20asesor%C3%ADa" target="_blank" class="chat-link-btn">💬 Asesoría por WhatsApp</a>`;
                    addMessage(fallbackMsg, 'bot', true, false, 'Sistema');
                    setTimeout(() => { renderMenu(currentProfileMenu); }, 600);
                }, 500);
                return;
            }
            // =========================================================

            const saludosComunes = ['hola', 'holaaa', 'ola', 'buenas', 'buenos dias', 'buenas tardes', 'buenas noches', 'saludos', 'hello', 'hi', 'oli', 'buen dia'];
            if (saludosComunes.includes(txt)) {
                setTimeout(() => {
                    hideTyping();
                    renderAnswer({ botText: '¡Hola! 👋 Soy tu Guía UAN. Estoy aquí para orientarte.<br><br>Para darte la mejor información, cuéntame ¿cuál es tu perfil?', showMenu: 'main' });
                    setTimeout(() => { renderMenu('main'); }, 600);
                }, 400);
                return;
            }

            // ====== 2. LECTURA DIRECTA DE LA VARIABLE LOCAL (MENÚS) ======
            try {
                const renderRow = (optionInfo, origen = 'Base Local') => {
                    hideTyping();
                    
                    let finalBotText = optionInfo.botReply || optionInfo.text || '';
                    finalBotText = finalBotText.replace('Derechos Pecuniarios', '<strong><u>Derechos Pecuniarios</u></strong>')
                                               .replace('Descargar Recibos', '<strong><u>Descargar Recibos</u></strong>');

                    renderAnswer({ 
                        botText: finalBotText, 
                        links: optionInfo.links || [], 
                        showMenu: optionInfo.showMenu || 'CURRENT', 
                        origenRespuesta: origen 
                    });
                    
                    const nextMenu = (optionInfo.showMenu || 'CURRENT') === 'CURRENT' ? currentProfileMenu : optionInfo.showMenu;
                    setTimeout(() => { renderMenu(nextMenu); }, 1600);
                };

                let matchObj = null;
                const exactId = text.trim();
                for (const key in menus) {
                    const found = menus[key].find(item => item.id === exactId);
                    if (found) {
                        matchObj = found;
                        break;
                    }
                }

                if (matchObj) {
                    renderAnswer({
                        botText: matchObj.botReply || '',
                        links: matchObj.links || [],
                        showMenu: matchObj.showMenu || 'CURRENT',
                        origenRespuesta: skipUserMessage ? 'Menús' : 'Base Local'
                    });
                    return;
                }

                // ====== 2. CONSULTA DIRECTA A LA INTELIGENCIA ARTIFICIAL (Streaming SSE con NLP) ======
                if (window.ReadableStream && window.TextDecoder) {
                    try {
                        const streamOk = await fetchStreamIA(text);
                        if (streamOk) return;
                    } catch (errStream) {
                        console.warn("Fallo el streaming SSE, recurriendo al modo síncrono...", errStream);
                    }
                }

                // ====== 3. MODO SÍNCRONO DE RESPALDO (Fallback si el streaming no estuviera disponible) ======
                try {
                    const iaUrl = "/configuracion_chat.php?chat_ai=1&q=" + encodeURIComponent(text);
                    let iaRes = await fetch(iaUrl);
                    
                    if (!iaRes.ok && (iaRes.status === 499 || iaRes.status === 502 || iaRes.status === 504)) {
                        await new Promise(r => setTimeout(r, 1000));
                        iaRes = await fetch(iaUrl);
                    }
                    
                    if (iaRes.ok) {
                        const iaRawText = await iaRes.text();
                        let iaData;
                        try {
                            iaData = JSON.parse(iaRawText);
                        } catch (err) { throw new Error("No es JSON"); }
                        
                        if (iaData && iaData.is_rag === true && iaData.respuesta && iaData.respuesta !== "q_desconocido") {
                            const respuestaStr = iaData.respuesta.trim();
                            if (respuestaStr.startsWith('q_menu_') || respuestaStr.startsWith('q_disambig_')) {
                                let matchObjIA = null;
                                for (const key in menus) {
                                    const found = menus[key].find(item => item.id === respuestaStr);
                                    if (found) {
                                        matchObjIA = found;
                                        break;
                                    }
                                }
                                if (matchObjIA) {
                                    renderAnswer({ botText: matchObjIA.botReply || '', links: matchObjIA.links || [], showMenu: matchObjIA.showMenu || 'CURRENT', origenRespuesta: 'IA (Menú)' });
                                    return;
                                }
                            }
                            hideTyping();
                            addMessage(respuestaStr, 'bot', true, false, 'Inteligencia Artificial');
                            return;
                        }
                    } else {
                        console.error("HTTP no OK:", iaRes.status);
                    }
                } catch (e) {
                    console.error("Error contactando al proxy de IA Gemini:", e);
                }
            } catch (errorMenu) {
                console.error("Error procesando los menús locales:", errorMenu);
            }

            // ====== 4. SI LA IA FALLA, O DICE 'DESCONOCIDO', MOSTRAMOS WHATSAPP ======
            hideTyping();
            const fallbackMsg = `Recuerda que soy tu asistente de navegación en la UAN 🤗. Para asesoría directa sobre inscripciones, precios o dudas de programas, chatea directamente con un asesor por WhatsApp:<br><br><a href="https://api.whatsapp.com/send/?phone=573223447443&text=Hola,%20necesito%20asesor%C3%ADa%20personalizada" target="_blank" class="chat-link-btn">💬 Asesoría por WhatsApp</a>`;
            addMessage(fallbackMsg, 'bot', true, false, 'Mensaje por Defecto');
            // UX: No mostrar el menú repetitivamente después del fallback
        }

        /**
         * Wrapper para simplificar el llamado a showAutocomplete
         */
        function renderAnswer(answerData) {
            let linksHtml = '';

            if (answerData.links && answerData.links.length > 0) {
                answerData.links.forEach(l => {
                    let safeUrl = l.url ? l.url.trim() : '';
                    if (safeUrl && !safeUrl.startsWith('http') && !safeUrl.startsWith('/')) {
                        safeUrl = 'https://' + safeUrl;
                    }
                    
                    // Adaptar las URLs del servidor original al servidor de pruebas actual
                    if (safeUrl.includes('www.uan.edu.co')) {
                        safeUrl = safeUrl.replace('https://www.uan.edu.co', BASE_DOMAIN)
                                         .replace('http://www.uan.edu.co', BASE_DOMAIN);
                    }
                    
                    // Limpieza en caso de doble URL errónea proveniente de Joomla o Excel
                    if (safeUrl.includes(BASE_DOMAIN + '/https://')) {
                        safeUrl = safeUrl.replace(BASE_DOMAIN + '/', '');
                    }

                    const isInternal = safeUrl.startsWith(BASE_DOMAIN) || safeUrl.startsWith('/');
                    const target = isInternal ? '_self' : '_blank';
                    linksHtml += '<a href="' + safeUrl + '" class="chat-link-btn" target="' + target + '">' + l.text + '</a>';
                });
            }

            hideTyping();
            if (linksHtml) {
                const botHtml = answerData.botText + '<div style="margin-top:10px;display:flex;flex-wrap:wrap;">' + linksHtml + '</div>';
                addMessage(botHtml, 'bot', true, false, answerData.origenRespuesta);
            } else {
                // Sin links ni selector dinámico: texto informativo solamente
                addMessage(answerData.botText, 'bot', true, false, answerData.origenRespuesta);
            }
        }

        /**
         * Agrega un mensaje (burbuja de texto) al contenedor de la conversación.
         * @param {string} content - El texto o HTML a mostrar.
         * @param {string} sender - Quién envía el mensaje ('bot' o 'user'). Define el estilo de la burbuja.
         * @param {boolean} isHtml - 'true' si el contenido tiene etiquetas HTML que deben interpretarse. 'false' por defecto.
         * @param {boolean} skipSave - Evita guardar el mensaje en el historial (útil al restaurar).
         */
        function addMessage(content, sender, isHtml = false, skipSave = false, origenRespuesta = null) {
            let savePromise = null;
            if (!skipSave) {
                chatHistory.push({ content, sender, isHtml, origenRespuesta });
                localStorage.setItem('uan_chat_history', JSON.stringify(chatHistory));
                savePromise = saveMessageToDB(content, sender, origenRespuesta);
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + sender;
            if (isHtml) {
                msgDiv.innerHTML = content;
            } else {
                msgDiv.textContent = content; // Para texto plano, usamos textContent para evitar ataques XSS
            }

            let messageContainer = msgDiv;

            // Si es un mensaje del bot, se envuelve en un contenedor flex para poner su avatar al lado
            if (sender === 'bot') {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'bot-message-row';
                const img = document.createElement('img');
                img.src = `${BASE_DOMAIN}/images/admin/ChatBot/GnosUAN-small.png`;
                img.className = 'bot-avatar-chat';
                img.alt = 'Bot Avatar';
                rowDiv.appendChild(img);
                
                const msgWrapper = document.createElement('div');
                msgWrapper.style.display = 'flex';
                msgWrapper.style.flexDirection = 'column';
                msgWrapper.style.maxWidth = '100%';
                msgWrapper.appendChild(msgDiv);
                
                rowDiv.appendChild(msgWrapper);
                chatBody.appendChild(rowDiv);
                messageContainer = msgWrapper;
            } else {
                // Si es del usuario, se agrega la burbuja directamente (se alinea a la derecha mediante CSS)
                chatBody.appendChild(msgDiv);
            }
            scrollToBottom();
            
            // Añadir botones de calificación si es IA y se acaba de guardar
            if (!skipSave && sender === 'bot' && origenRespuesta === 'Inteligencia Artificial' && savePromise) {
                savePromise.then(id_mensaje => {
                    if (id_mensaje) {
                        const feedbackDiv = document.createElement('div');
                        feedbackDiv.className = 'feedback-container';
                        
                        const likeBtn = document.createElement('button');
                        likeBtn.className = 'feedback-btn like-btn';
                        likeBtn.title = 'Me sirvió';
                        likeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>';
                        
                        const dislikeBtn = document.createElement('button');
                        dislikeBtn.className = 'feedback-btn dislike-btn';
                        dislikeBtn.title = 'No me sirvió';
                        dislikeBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>';
                        
                        const handleRate = (calificacion) => {
                            if(likeBtn.disabled) return;
                            likeBtn.disabled = true;
                            dislikeBtn.disabled = true;
                            if(calificacion === 1) likeBtn.classList.add('active-like');
                            if(calificacion === -1) dislikeBtn.classList.add('active-dislike');
                            
                            fetch('/configuracion_chat.php?accion_secreta=calificar_respuesta', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ id_mensaje: id_mensaje, calificacion: calificacion, codigo_navegador: sessionId })
                            }).catch(() => {});
                        };
                        
                        likeBtn.onclick = () => handleRate(1);
                        dislikeBtn.onclick = () => handleRate(-1);
                        
                        feedbackDiv.appendChild(likeBtn);
                        feedbackDiv.appendChild(dislikeBtn);
                        messageContainer.appendChild(feedbackDiv);
                        scrollToBottom();
                    }
                });
            }
        }

        /**
         * Evento para abrir y cerrar la ventana de chat cuando se da clic en el botón flotante principal.
         */
        chatToggle.addEventListener('click', function () {
            chatWindow.classList.toggle('active'); // Alterna la visibilidad de la ventana de chat
            chatToggle.classList.toggle('active'); // Alterna el ícono del botón flotante (ícono de chat <-> 'X' para cerrar)
            
            // Guardar estado en sessionStorage
            sessionStorage.setItem('uan_chat_isOpen', chatWindow.classList.contains('active'));

            // Posicionar dinámicamente la ventana del chat al lado del botón
            if (chatWindow.classList.contains('active')) {
                setTimeout(scrollToBottom, 300);
            }
        });

        // Evento para cerrar la ventana desde la X interna del chat
        innerCloseBtn.addEventListener('click', function() {
            chatWindow.classList.remove('active');
            chatToggle.classList.remove('active');
            sessionStorage.setItem('uan_chat_isOpen', 'false');
        });

        // Función para restaurar el estado desde sessionStorage al cambiar de página
        function restoreState() {
            const isOpen = sessionStorage.getItem('uan_chat_isOpen') === 'true';
            if (isOpen) {
                chatWindow.classList.add('active');
                chatToggle.classList.add('active');
            }

            if (chatHistory.length > 0) {
                // Restaurar mensajes desde el historial
                chatHistory.forEach(msg => {
                    addMessage(msg.content, msg.sender, msg.isHtml, true, msg.origenRespuesta);
                });
                

                
                // Restaurar el menú de roles únicamente si solo existe el saludo inicial y aún no ha conversado
                if (chatHistory.length <= 1) {
                    const lastMenu = localStorage.getItem('uan_chat_lastMenu') || 'main';
                    renderMenu(lastMenu, true);
                }
                
                // Forzamos el scroll hacia abajo en varios momentos para dar tiempo a que las imágenes carguen
                setTimeout(scrollToBottom, 100);
                setTimeout(scrollToBottom, 500);
                setTimeout(scrollToBottom, 1000);
            } else {
                // Comportamiento por defecto la primera vez
                addMessage("¡Hola! 👋 Soy tu Guía UAN. Estoy aquí para orientarte.<br><br>Si no sabes dónde está algo en el sitio web, ¡yo te llevo!<br><br>Para empezar, selecciona tu perfil:", "bot", true, false, 'Mensaje de Bienvenida');
                setTimeout(() => {
                    renderMenu('main');
                }, 500);
            }
        }

        // Llamar a restaurar estado al iniciar
        restoreState();

        // ==========================================
        // LÓGICA DE PROACTIVIDAD (BURBUJA FLOTANTE MINI)
        // ==========================================
        function initProactiveBot() {
            // Usamos el sessionId global (generado por manageSession de 48 horas)
            const proactiveKey = 'uan_proactive_fired_' + sessionId;

            // Verificar si en ESTA sesión ya se mostró la burbuja
            if (localStorage.getItem(proactiveKey) === 'true') return;

            // 1. Inyectar los estilos CSS de la burbuja dinámicamente
            const style = document.createElement('style');
            style.innerHTML = `
                #uan-proactive-bubble {
                    position: fixed;
                    bottom: 35px; /* Alineado con el botón del chat */
                    left: 90px; /* Aparece a la derecha del botón del chat */
                    background: #ffffff;
                    border-radius: 12px;
                    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
                    padding: 12px 28px 12px 16px;
                    max-width: 250px;
                    z-index: 2147483646;
                    font-family: 'Inter', sans-serif;
                    font-size: 13px;
                    color: #1e293b;
                    opacity: 0;
                    pointer-events: none;
                    transform: translateX(-15px);
                    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                    border: 1px solid #e2e8f0;
                }
                #uan-proactive-bubble::before {
                    content: '';
                    position: absolute;
                    left: -7px;
                    top: 50%; /* Centrado verticalmente apuntando al avatar */
                    transform: translateY(-50%);
                    border-top: 8px solid transparent;
                    border-bottom: 8px solid transparent;
                    border-right: 8px solid #ffffff;
                    filter: drop-shadow(-2px 0px 1px rgba(0,0,0,0.05));
                }
                #uan-proactive-bubble.show {
                    opacity: 1;
                    pointer-events: auto;
                    transform: translateX(0);
                }
                .bubble-close {
                    position: absolute;
                    top: 4px;
                    right: 8px;
                    font-size: 18px;
                    color: #94a3b8;
                    cursor: pointer;
                    line-height: 1;
                    transition: color 0.2s;
                }
                .bubble-close:hover {
                    color: #ef4444;
                }
                .bubble-text {
                    cursor: pointer;
                    line-height: 1.4;
                    font-weight: 500;
                }
            `;
            document.head.appendChild(style);

            // 2. Determinar el mensaje según la URL
            let saludo = "¡Hola! 👋 Veo que estás explorando. ¿Necesitas ayuda rápida?";
            const url = window.location.href.toLowerCase();

            if (url.includes('grados') || url.includes('egresado')) {
                saludo = "¡Hola futuro egresado! 🎓 ¿Dudas sobre los requisitos de grado?";
            } else if (url.includes('matricula') || url.includes('inscripcion')) {
                saludo = "¡Hola! 📝 ¿Te ayudo con tu matrícula o fechas de inscripción?";
            } else if (url.includes('biblioteca') || url.includes('crai')) {
                saludo = "¡Hola! 📚 ¿Necesitas saber cómo sacar un libro de la biblioteca?";
            }

            // 3. Crear el HTML de la burbuja
            const bubble = document.createElement('div');
            bubble.id = 'uan-proactive-bubble';
            bubble.innerHTML = `
                <div class="bubble-close" id="bubbleCloseBtn" title="Cerrar">×</div>
                <div class="bubble-text" id="bubbleTextBtn">
                    ${saludo}
                </div>
            `;
            document.body.appendChild(bubble);

            // 4. Lógica de Interacción
            const closeBtn = document.getElementById('bubbleCloseBtn');
            const textBtn = document.getElementById('bubbleTextBtn');

            // Si cierra la burbuja con la X
            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                bubble.classList.remove('show');
                localStorage.setItem(proactiveKey, 'true');
            });

            // Si hace clic en el texto para pedir ayuda
            textBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                bubble.classList.remove('show'); // Ocultar burbuja
                localStorage.setItem(proactiveKey, 'true');

                // Abrir el chat y enviar el mensaje
                setTimeout(() => {
                    if (!chatWindow.classList.contains('active')) {
                        chatToggle.click();
                    }
                    // Mandar el saludo usando la categoría estándar para no dañar las gráficas
                    addMessage(saludo, "bot", false, false, 'Mensaje de Bienvenida');
                }, 100);
            });

            // 5. Temporizador para mostrar la burbuja
            setTimeout(() => {
                const isChatOpen = chatWindow.classList.contains('active');
                if (isChatOpen) {
                    localStorage.setItem(proactiveKey, 'true');
                    return; 
                }
                
                bubble.classList.add('show');
                localStorage.setItem(proactiveKey, 'true'); // Marcar que ya se le mostró

                // 6. Desaparecer automáticamente después de 8 segundos
                setTimeout(() => {
                    bubble.classList.remove('show');
                }, 8000);

            }, 8000);    // 8 segundos para que no esperes tanto
        }

        // Iniciar el sistema proactivo
        initProactiveBot();

    })();
</script>
